<svg width="680" height="400" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
<title>夜の空とスマートウォッチの睡眠スコア画面のイラスト</title>
<desc>紺色のグラデーションの夜空に三日月と星が浮かび、中央にスマートウォッチが表示され、画面には三日月アイコンと睡眠スコア72、下に緩やかな波形が描かれている</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0e1633"/>
<stop offset="1" stop-color="#202c58"/>
</linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#141d3d"/>
<stop offset="1" stop-color="#0a0f24"/>
</linearGradient>
</defs>
